<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="BUTTERFUL(버터풀) - 원어민 목소리를 듣고 따라 말하며 혼자서 회화를 연습하는 대화형 외국어 학습">
  <meta name="theme-color" content="#FFF9EE">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BUTTERFUL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>BUTTERFUL 버터풀</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFF9EE; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: #2A2420; transition: opacity .3s ease;
    }
    #splash img { width: 88px; height: 88px; }
    #splash .name { font-size: 26px; font-weight: 900; letter-spacing: 3px; }
    #splash .sub { font-size: 14px; color: #6E5A4B; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #EFE4D3; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #F6C945; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="BUTTERFUL 불러오는 중">
    <img src="favicon.svg" alt="">
    <div class="name">BUTTERFUL</div>
    <div class="sub">듣고, 따라 말하고, 대화해요</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // 첫 화면이 그려지면 시작 화면을 걷어 낸다.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
